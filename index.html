<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Mechismu Racing — Formula Student Team" />
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="google-site-verification" content="eiTU9GmXGWYYuf8RHxszw9qSSrXDYjkFcgNdPi6sZdo" />
  <!-- google site verification -->

  <link rel="icon" type="image/png" sizes="16x16" href="/images/logo_16_16.png" />
  <link rel="icon" type="image/jpeg" sizes="32x32" href="/images/logo_32_32.jpg" />
  <link rel="icon" type="image/jpeg" sizes="48x48" href="/images/logo_48_48.jpg" />

  <!-- DNS prefetch + preconnect for Google Fonts (critical for FCP) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="dns-prefetch" href="https://fonts.googleapis.com" />

  <!-- Preload critical LCP font (Space Grotesk 700 — hero title) -->
  <link
    rel="preload"
    as="style"
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700;900&display=swap"
    onload="this.onload=null;this.rel='stylesheet'"
  />
  <noscript>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700;900&display=swap" />
  </noscript>

  <!-- Non-critical fonts loaded asynchronously -->
  <link
    rel="preload"
    as="style"
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=Inter:wght@300;400;500;600;700&family=Oxanium:wght@400;600;700&family=Poppins:wght@300;400;500;600&display=swap"
    onload="this.onload=null;this.rel='stylesheet'"
  />
  <noscript>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=Inter:wght@300;400;500;600;700&family=Oxanium:wght@400;600;700&family=Poppins:wght@300;400;500;600&display=swap" />
  </noscript>

  <title>Mechismu Racing electric</title>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
